# ================================================================
# mcserver-ai · docker compose
# ================================================================
# 三步起服务：
#   1. cp .env.example .env   → 填好里面的值（尤其是 RCON / SSH 密码和 API Key）
#   2. docker compose up -d --build
#   3. docker compose logs -f
#
# 常用命令：
#   docker compose run --rm mc-agent check    # 只跑配置体检，不启动监听
#   docker compose ps                        # 看健康状态
#   docker compose down                      # 停止
# ================================================================

services:
  mc-agent:
    build:
      context: .
      args:
        UID: ${MC_UID:-1000}
        GID: ${MC_GID:-1000}
        # 国内网络慢就取消 .env 里这两行的注释，构建时会自动换上镜像源
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: mcserver-ai:latest
    container_name: mc-agent
    restart: unless-stopped

    # 所有配置都从 .env 注入，启动时由 docker/entrypoint.py 生成 config.json
    env_file:
      - .env

    extra_hosts:
      # 让容器内的 host.docker.internal 指回宿主机
      # （Docker Desktop 自带；Linux 上要靠这条，需要 Docker 20.10+）
      - "host.docker.internal:host-gateway"

    # ------------------------------------------------------------
    # 默认挂载（开箱即用）：
    #   ./data:/data —— 长期记忆落在宿主机 data/ 目录里，容器重建、升级镜像都不丢，
    #   而且可以直接用编辑器打开 ./data/memory.json 修改、备份、比 diff。
    #   首次使用务必先建目录并交给容器内的用户（默认 uid 1000）：
    #       mkdir -p ./data && sudo chown -R 1000:1000 ./data
    #   路径由 docker/entrypoint.py 在启动时自动指到 /data/memory.json，
    #   不需要你写任何环境变量。
    #
    # 想改用 Docker 命名卷（不用管属主，但文件藏在 /var/lib/docker 里、要 root 才能碰）：
    #   把下面 `- ./data:/data` 换成 `- mc-data:/data`，并取消文件末尾 volumes 段的注释。
    #
    # 其他可选挂载：
    #   local 模式必须挂日志目录（只读），并把 MC_LOCAL_LOG_PATH 指向容器内路径
    #   想用整份手写配置代替环境变量时，再挂 config.json（文件必须已存在！）
    # ------------------------------------------------------------
    volumes:
      - ./data:/data
      # - mc-data:/data                   # 命名卷备选，需配合文件末尾的 volumes 段
      # - ${MC_LOG_DIR:-./logs}:/logs:ro
      # - ./config.json:/app/config.json:ro

    # docker stop 时先给 15 秒收尾：容器里的 SIGTERM 会被转成 Ctrl+C 的优雅退出
    stop_grace_period: 15s

    healthcheck:
      test: ["CMD", "python", "/app/docker/entrypoint.py", "probe"]
      interval: 30s
      timeout: 8s
      start_period: 20s
      retries: 3

    logging:
      # 24/7 跑着，别让日志把磁盘写满
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ------------------------------------------------------------
# 默认用宿主机目录 ./data 存长期记忆（见上方 volumes），这里不需要命名卷。
# 如果你改用了 `- mc-data:/data`，把下面两行的注释去掉即可。
# 备份 / 恢复（bind 目录更省事）：
#   tar czf memory-backup.tgz -C ./data .
#   tar xzf memory-backup.tgz -C ./data
# ------------------------------------------------------------
# volumes:
#   mc-data:
